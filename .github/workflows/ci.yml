name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Build du fichier unique
        run: OUT="$RUNNER_TEMP/EMT - la machine 260905 - horizon.html" node build.js
      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-html
          path: ${{ runner.temp }}/EMT - la machine 260905 - horizon.html
